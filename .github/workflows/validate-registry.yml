name: Validate Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate registry JSON
        run: node -e "JSON.parse(require('fs').readFileSync('registry.json','utf8')); console.log('registry ok')"
      - name: Validate registry against schema
        run: node scripts/validate-schema.mjs
      - name: Enforce context_ready quality tier
        run: node scripts/validate-context-ready.mjs
