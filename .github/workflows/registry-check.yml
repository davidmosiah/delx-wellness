name: registry-sync

on:
  pull_request:
    paths:
      - 'registry.json'
      - 'STATUS.md'
      - 'docs/release-index.md'
      - 'scripts/sync-registry.mjs'
      - 'scripts/test-sync-registry.mjs'
      - 'scripts/validate-release-index.mjs'
      - '.github/workflows/registry-check.yml'
  schedule:
    # Every Monday 14:00 UTC = 11:00 BRT
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test registry checker offline
        run: node --test scripts/test-sync-registry.mjs
      - name: Check registry vs npm
        id: drift
        run: |
          result=0
          node scripts/sync-registry.mjs --check --quiet || result=$?
          case "$result" in
            0)
              echo "drift=false" >> "$GITHUB_OUTPUT"
              echo "Registry is in sync with npm."
              ;;
            1)
              echo "drift=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Registry has drifted from npm. Run \`node scripts/sync-registry.mjs\` locally and commit."
              ;;
            *)
              echo "drift=unknown" >> "$GITHUB_OUTPUT"
              echo "::warning::Registry npm status UNKNOWN: incomplete reads or checker failure; drift was not established."
              ;;
          esac
          # Discovery remains informational on schedule and PR runs. Unknown
          # reads are not a clean result or a request to refresh the catalog.
