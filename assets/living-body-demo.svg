<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Terminal demo: npx -y delx-living-body demo answering 'Should I train hard today?' with a green light, confidence high, zero LLM calls.">
